name = "rafadataapp" # renamed from upwork-autobidder (Celia, Oct 30); must match the Worker's name in Cloudflare
main = "src/index.ts"
compatibility_date = "2025-09-01"
# Keep variables added in the Cloudflare dashboard when Workers Builds deploys. Without this, every deploy deleted
# them (Oct 28: RESEND_API_KEY added as a plain "Text" variable vanished and the report stopped). Secrets are kept either way.
keep_vars = true

# Three separate runs, so each gets its own Workers limits. None of them searches Upwork (Oct 30: search restricted on
# Rafa's account; jobs are added by link, src/pipeline/jobs.ts):
#   every minute       send one approved proposal. Review: minute 0, 5, 10…; Auto: every minute (src/pipeline/pace.ts)
#   minutes 1–59       score and write proposals for jobs added by link (nothing to do: no Upwork call)
#   minute 3, 8, 13…   upkeep: Connects balance, Loom cleanup/keep-alive/alerts, daily report (3 pm Pacific)
[triggers]
crons = ["* * * * *", "1-59 * * * *", "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"]

# The dashboard HTML is bundled into the Worker as text.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.sql"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "autobidder"
database_id = "77c7e7e7-0532-4a58-b61e-36161370a136"

# Worker logs (Cloudflare → Workers → rafadataapp → Observability). Kept on by every deploy (BUILD_PLAN §10).
[observability]
enabled = true

[vars]
CLAUDE_MODEL = "claude-sonnet-5-5"
UPWORK_MCP_URL = "https://mcp.upwork.com/mcp"

# Secrets (set with `wrangler secret put NAME`, or in .dev.vars for local dev):
#   DASH_PASSWORD              dashboard login (password only)
#   TOKEN_KEY                  32+ random chars, encrypts stored Upwork/Loom sessions
#   ANTHROPIC_API_KEY          cover letters + match scoring
#   RESEND_API_KEY             daily report email and the low-Connects alert
#   INTAKE_SECRET              32+ random chars; enables POST /api/jobs/intake (jobs added by link from other services)
#   REPORT_FROM                sender address on a Resend-verified domain (optional until the domain is verified)
