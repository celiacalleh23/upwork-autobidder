name = "rafadataapp" # renamed from upwork-autobidder (Celia, Oct 30); must match the Worker's name in Cloudflare
main = "src/index.ts"
compatibility_date = "2025-09-01"
# Keep variables added in the Cloudflare dashboard when Workers Builds deploys. Without this, every deploy deleted
# them (Oct 28: RESEND_API_KEY added as a plain "Text" variable vanished and the report stopped). Secrets are kept either way.
keep_vars = true

# Three separate runs. Search access restored per account owner; discovery uses shared rolling quotas.
#   every minute       discover on alternating accounts at :00/:15/:30/:45, then send one approved proposal. Review: minute 0, 5, 10…; Auto: eligibility checked every minute, random 5–16 min between sends (src/pipeline/pace.ts)
#   minutes 1–59       score and write proposals for jobs added by link (nothing to do: no Upwork call)
#   minute 3, 8, 13…   upkeep: Connects balance, Loom cleanup/keep-alive/alerts, daily report (3 pm Pacific)
[triggers]
crons = ["* * * * *", "1-59 * * * *", "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"]

# The dashboard HTML is bundled into the Worker as text.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.sql"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "autobidder"
database_id = "77c7e7e7-0532-4a58-b61e-36161370a136"

# Worker logs (Cloudflare → Workers → rafadataapp → Observability). Kept on by every deploy (BUILD_PLAN §10).
[observability]
enabled = true

[vars]
SCAN_ACCOUNT_DISABLED = "true"
CLAUDE_MODEL = "claude-sonnet-5-5"
UPWORK_MCP_URL = "https://mcp.upwork.com/mcp"
INDEPENDENT_DRAFTS = "true"

# Secrets (set with `wrangler secret put NAME`, or in .dev.vars for local dev):
#   DASH_PASSWORD              dashboard login (password only)
#   TOKEN_KEY                  32+ random chars, encrypts stored Upwork/Loom sessions
#   ANTHROPIC_API_KEY          cover letters + match scoring
#   RESEND_API_KEY             daily report email and the low-Connects alert
#   INTAKE_SECRET              32+ random chars; enables POST /api/jobs/intake (jobs added by link from other services)
#   REPORT_FROM                sender address on a Resend-verified domain (optional until the domain is verified)

# Workers Builds branch previews (Wrangler 4.156). Production deploys do not use this block.
# Vars and D1 bindings are not inherited, so the preview lists its own. The database below is empty and
# separate from production autobidder. Do not add triggers, routes, or queue consumers here: those settings
# target production. Do not add service, workflow, or queue-producer bindings. Do not put secrets in this file.
# Secret inheritance into a preview is not visible from the repo. PREVIEW_ISOLATION makes the Worker refuse
# Upwork, Apify, Claude, Loom, email, webhooks, OAuth, and scheduled work even if a secret is present.
[previews.vars]
PREVIEW_ISOLATION = "true"
SCAN_ACCOUNT_DISABLED = "true"
CLAUDE_MODEL = "preview-disabled"
UPWORK_MCP_URL = "https://invalid.example"
INDEPENDENT_DRAFTS = "false"

[[previews.d1_databases]]
binding = "DB"
database_name = "rafadataapp-pr1-preview"
database_id = "c8aed43e-50cc-4d79-8f50-fee163b76763"
